# Metaculus MiniBench bot — runs the baseline forecaster on a schedule.
#
# Setup (one time, by the repo owner):
#   1. Push this repo to GitHub (e.g. senguyen72/metaculus-minibench-bot).
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository
#      secret:  METACULUS_TOKEN = the senguyen72-bot API token
#      (the token lives in drive_puzzle/metaculus/config.json locally;
#      NEVER commit config.json or state.json — see .gitignore).
#   3. The workflow runs every 6 hours and can also be triggered manually
#      from the Actions tab (workflow_dispatch).
#
# Notes:
#   * The bot only forecasts questions in the current MiniBench round
#     (tournament slug "minibench") that it has not forecast yet.
#   * State (submitted question ids) is kept in state.json inside the repo
#     workspace; each run commits it back so re-runs never double-submit.
#     The commit step needs the default GITHUB_TOKEN write permission on
#     the repo (Settings -> Actions -> General -> Workflow permissions ->
#     "Read and write permissions").
#   * No paid services are used: the bot is stdlib-only Python, no LLM calls.
#   * A MiniBench round opens most questions in week 1 and almost none in
#     week 2, so many runs will legitimately find 0 open questions.

name: MiniBench forecast

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Forecast (submit)
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          python3 bot.py --submit --tournament minibench 2>&1 | tee run.log
          echo "exit=$?"

      - name: Commit state
        run: |
          git config user.name "metaculus-bot"
          git config user.email "metaculus-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "bot run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "push failed (check workflow permissions)"
